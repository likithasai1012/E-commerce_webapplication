<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Password</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    form { max-width: 300px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
    input { width: 100%; padding: 8px; margin-bottom: 10px; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Update Password</h2>
  <form id="passwordForm">
    <label for="newPassword">New Password:</label>
    <input type="password" id="newPassword" required>

    <label for="confirmPassword">Confirm Password:</label>
    <input type="password" id="confirmPassword" required>

    <div id="message"></div>
    <button type="submit">Update</button>
  </form>

  <script>
    const form = document.getElementById("passwordForm");
    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const password = newPassword.value;
      const confirm = confirmPassword.value;

      // Regex: exactly 8 chars, at least 1 letter, 1 digit, 1 special char
      const regex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8}$/;

      if (!regex.test(password)) {
        message.textContent = "Password must be 8 chars with a letter, number, and special char.";
        message.className = "error";
        return;
      }
      if (password !== confirm) {
        message.textContent = "Passwords do not match!";
        message.className = "error";
        return;
      }

      // Send PUT request to Flask
      fetch("{{url_for('newpassword',id_user=id_user)}}", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ new_password: password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.message) {
          message.textContent = "Password updated successfully! Redirecting to login...";
          message.className = "success";

          // Redirect to login after 2 seconds
          setTimeout(() => {
            window.location.href = "{{url_for('userlogin')}}";
          }, 2000);
        } else {
          message.textContent = data.error;
          message.className = "error";
        }
      })
      .catch(err => {
        message.textContent = "Error updating password!";
        message.className = "error";
      });
    });
  </script>
</body>
</html>
